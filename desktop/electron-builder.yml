# Thirty desktop packaging. Run from desktop/: npm run dist  (builds the Python backend first).
appId: app.thirty.desktop
productName: Thirty
copyright: "© 2026 Thirty"
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - updater.js
  - loading.html
  - error.html
  - thirty-lockup.svg
  - thirty-lockup-reverse.svg
  - package.json
  - "!node_modules/electron-updater/node_modules/**/*.d.ts"
extraResources:
  - from: build/backend
    to: backend
    filter: ["**/*"]
asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
publish:
  provider: github
  owner: jossefuggg
  repo: thirty
mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing: CSC_LINK / CSC_KEY_PASSWORD env (see docs/RELEASING.md); unsigned when absent.
win:
  target:
    - target: nsis
      arch: [x64]
  # Signing: CSC_LINK / CSC_KEY_PASSWORD env; unsigned when absent.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Thirty
linux:
  category: Science
  maintainer: Thirty <noreply@thirty.app>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
