<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thirty</title>
<style>
  :root { --paper: #F7F5F0; --ink: #15181D; --coral: #FF5A3C; --slate: #5B6470; --stone: #DDD8CE; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 500 15px/1.5 -apple-system, "Segoe UI", Arial, sans-serif; }
  .c { height: 100%; display: grid; place-items: center; text-align: center; }
  .c img { width: 180px; height: auto; margin-bottom: 28px; }
  .bar { width: 180px; height: 6px; border-radius: 999px; background: var(--stone); overflow: hidden; margin: 0 auto 16px; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: var(--ink); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .s { color: var(--slate); font-size: 14px; }
  @media (prefers-color-scheme: dark) { html, body { background: var(--ink); color: var(--paper); } .bar { background: #3A414B; } .bar i { background: var(--paper); } .light { display: none; } }
  @media (prefers-color-scheme: light) { .dark { display: none; } }
</style>
</head>
<body><div class="c"><div>
  <img class="light" src="thirty-lockup.svg" alt="Thirty"><img class="dark" src="thirty-lockup-reverse.svg" alt="Thirty">
  <div class="bar"><i></i></div>
  <div class="s">Starting the local backend…</div>
</div></div></body>
</html>
