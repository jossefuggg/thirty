{% extends "base.html" %}
{% block actions %}
<a class="btn btn-secondary" href="/integrations">{{ icon('plug') }}Integrations</a>
<a class="btn btn-primary" href="/integrations#upload">{{ icon('upload') }}Upload file</a>
{% endblock %}
{% block head %}
<style>
  .ib-wrap { display: flex; flex-direction: column; min-height: 0; }
  .ib-wrap .card { display: flex; flex-direction: column; min-height: 0; }
  .ib-scroll { overflow-x: auto; }
  /* intake item states: ink = done, outline = waiting, amber outline = needs attention */
  .st-processed { background: var(--text); color: var(--bg); } .st-queued { background: var(--hover); color: var(--muted); } .st-processing { background: transparent; color: var(--text); border-color: var(--text); }
  .st-duplicate { background: transparent; color: var(--muted); border-color: var(--border); } .st-error, .st-rejected { background: transparent; color: var(--text); border-color: var(--t-amber); }
  .tbl td.ex { max-width: 420px; }
  .tbl td.ex b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl td.ex span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lnk { display: inline-flex; align-items: center; gap: 4px; } .lnk .i { width: 14px; height: 14px; }
  .working { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .select-sm { height: 36px; width: auto; font-size: 13px; padding: 0 10px; }
</style>
{% endblock %}
{% block body %}
<div class="ib-wrap">
  <section class="card">
    <div class="toolbar">
      <span id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <span class="grow"></span>
      <span class="working" id="working"></span>
      <select class="input select-sm" id="f-src" aria-label="Source">
        <option value="">All sources</option>{% for k, v in SOURCES.items() %}<option value="{{ k }}">{{ v[0] }}</option>{% endfor %}
      </select>
      <label class="tsearch">{{ icon('search') }}<input id="f-q" placeholder="Filter by ID, reporter, device" aria-label="Filter intake items"></label>
    </div>
    <div class="ib-scroll">
      <table class="tbl">
        <thead><tr><th>Source</th><th>Item</th><th>Reporter</th><th>Received</th><th>Status</th><th>Complaint</th></tr></thead>
        <tbody id="rows"><tr class="state"><td colspan="6"><div class="empty loading"><span class="spin"></span><b>Loading intake items…</b></div></td></tr></tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var data = null, status = "", sig = "";
  var LABEL = { queued: "Queued", processing: "Processing", processed: "Processed", duplicate: "Duplicate", error: "Error", rejected: "Rejected" };
  function fmt(t) { var d = new Date(t); return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  function render() {
    if (!data) return;
    var c = data.counts, all = data.items.length;
    $("filters").innerHTML = [["", "All", all]].concat(Object.keys(LABEL).filter(function (k) { return k !== "rejected"; }).map(function (k) { return [k, LABEL[k], c[k] || 0]; }))
      .map(function (f) { return '<button class="fpill' + (status === f[0] ? " on" : "") + '" data-s="' + f[0] + '">' + f[1] + " <em>" + f[2] + "</em></button>"; }).join("");
    var src = $("f-src").value, q = $("f-q").value.trim().toLowerCase();
    var rows = data.items.filter(function (it) {
      return (!status || it.status === status) && (!src || it.source === src) &&
        (!q || [it.cid, it.reporter, it.device, it.excerpt].join(" ").toLowerCase().indexOf(q) >= 0);
    });
    $("rows").innerHTML = rows.length ? rows.map(function (it) {
      var link = it.status === "processed" || it.status === "duplicate"
        ? '<a class="lnk" href="/complaint/' + encodeURIComponent(it.cid) + '" data-open="' + esc(it.cid) + '">#' + esc(it.cid) + ICONS.chevron + "</a>"
        : it.status === "error" ? '<span style="color:var(--muted);font-size:12px">' + esc(it.error || "failed") + "</span>"
        : '<span class="muted mono">#' + esc(it.cid) + "</span>";
      return "<tr><td>" + V.srcChip(it.source) + '</td><td class="ex"><b>' + esc(it.device || "Device not specified") + "</b><span>" + esc(it.excerpt) + "</span></td>" +
        "<td>" + (esc(it.reporter) || '<span class="muted">Not provided</span>') + '</td><td class="num muted">' + fmt(it.received) + "</td>" +
        '<td><span class="pill pill-sm st-' + esc(it.status) + '">' + (it.status === "processing" ? '<span class="spin" style="width:10px;height:10px"></span>' : "") + esc(LABEL[it.status] || it.status) + "</span></td>" +
        "<td>" + link + "</td></tr>";
    }).join("") : "";
    if (!rows.length) V.stateRow($("rows"), 6, "empty", all ? "No items match the filters" : "No items received yet", all ? "Clear a filter or change the search." : "Send a complaint to the REST API or upload a file on Integrations.");
    $("working").innerHTML = data.working ? '<span class="spin"></span>Classifying with the agent' : "";
  }
  function poll() {
    fetch("/api/intake", { cache: "no-store" }).then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (j) {
      var s = JSON.stringify(j); if (s === sig) return; sig = s; data = j; render();
    }).catch(function () { sig = ""; V.stateRow($("rows"), 6, "error", "Could not load the inbox", V.offline(), poll); });
  }
  $("filters").addEventListener("click", function (e) { var b = e.target.closest("[data-s]"); if (b) { status = b.dataset.s; render(); } });
  $("f-src").onchange = render; $("f-q").oninput = render;
  poll(); setInterval(poll, 2500);
})();
</script>
{% endblock %}
