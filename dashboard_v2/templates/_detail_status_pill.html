{% if r.status_kind == 'appr' %}<span class="pill s-appr">{{ icon('check') }}{{ r.status.replace('APPROVED by ', 'Approved · ') }}</span>{% elif r.status_kind == 'info' %}<span class="pill s-info">{{ icon('help') }}{{ r.status.replace('INFO REQUESTED by ', 'Info requested · ') }}</span>{% elif r.reportable %}<span class="pill s-pend">Pending review</span>{% else %}<span class="pill s-log">Logged</span>{% endif %}
